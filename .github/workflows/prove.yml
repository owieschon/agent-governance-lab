name: smoke

# Pull requests run the sub-90-second comparison, deterministic artifact check,
# full-repository lint, unit/static checks, secret scan, and browser
# accessibility path. The complete 50-case governor proof is intentionally in
# extended.yml (nightly/manual).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install the reviewed Ruff release
        run: python3 -m pip install --disable-pip-version-check ruff==0.15.18
      - name: Lint the full repository
        run: python3 scripts/check_ruff.py
      - name: Inspect patch whitespace
        run: git show --check --oneline --no-renames HEAD
      - name: Scan history and patch for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require actionable verifier messages
        run: python3 rails/verifier/nextstep_lint.py .
      - name: Test CLI, receipts, comparison refusal, and static accessibility
        run: python3 -m unittest discover -s tests -v
      - name: Refuse mutable source or schema rebinding
        run: python3 scripts/render_trusted_release.py --check
      - name: Strictly validate the separate engineering decision
        run: ./bin/agl verify-engineering-case
      - name: Re-run the preregistered comparison and check exact artifacts
        run: ./bin/agl compare --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise desktop/mobile receipts and WCAG checks
        run: npm run test:e2e
